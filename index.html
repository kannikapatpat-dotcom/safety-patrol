<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol Record System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .spinner-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <!-- Loading Spinner -->
    <div id="loading" class="spinner-overlay d-none">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container py-4">
        <h2 class="text-center mb-4 text-primary fw-bold"><i class="fa-solid fa-shield-halved"></i> ระบบบันทึกข้อมูล Safety Patrol</h2>

        <!-- สรุปข้อมูล (Summary Cards) -->
        <div class="row g-3 mb-4 text-center">
            <div class="col-md-3 col-6">
                <div class="card bg-primary text-white p-3">
                    <h6 class="card-title">รายการทั้งหมด</h6>
                    <h3 id="count-total" class="fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card bg-success text-white p-3">
                    <h6 class="card-title">ปลอดภัย/ปกติ</h6>
                    <h3 id="count-normal" class="fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card bg-warning text-dark p-3">
                    <h6 class="card-title">พบประเด็น (รอแก้ไข)</h6>
                    <h3 id="count-pending" class="fw-bold mb-0">0</h3>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card bg-danger text-white p-3">
                    <h6 class="card-title">อันตรายเร่งด่วน</h6>
                    <h3 id="count-danger" class="fw-bold mb-0">0</h3>
                </div>
            </div>
        </div>

        <!-- ฟอร์มกรอกข้อมูล -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white fw-semibold">
                <i class="fa-solid fa-pen-to-square"></i> ฟอร์มบันทึกข้อมูลการตรวจความปลอดภัย
            </div>
            <div class="card-body">
                <form id="patrolForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">ชื่อผู้ตรวจ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="inspector" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ตำแหน่ง / แผนกผู้ตรวจ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="position" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">วันที่ <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">เวลา <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" id="time" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label class="form-label">สถานะ <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" required>
                                <option value="">-- เลือกสถานะ --</option>
                                <option value="ปกติ">ปกติ / ปลอดภัย</option>
                                <option value="พบประเด็น">พบประเด็น (รอแก้ไข)</option>
                                <option value="อันตรายเร่งด่วน">อันตรายเร่งด่วน (Immediate Action)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ประเด็นที่พบ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="issue" placeholder="เช่น ไม่สวมPPE, สายไฟชำรุด" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">พบประเด็นที่แผนก/ฝ่าย <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="department" placeholder="เช่น แผนกผลิต, คลังสินค้า" required>
                        </div>
                        
                        <div class="col-md-12">
                            <label class="form-label">รายละเอียดเพิ่มเติม</label>
                            <textarea class="form-control" id="details" rows="2" placeholder="ระบุรายละเอียดหรือจุดที่พบเพิ่มเติม..."></textarea>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label">แนบรูปภาพ</label>
                            <input type="file" class="form-control" id="imageFile" accept="image/*">
                        </div>
                        
                        <div class="col-12 text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" onclick="resetForm()"><i class="fa-solid fa-rotate-left"></i> ล้างฟอร์ม</button>
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- ส่วนค้นหาและกรองข้อมูล -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="ค้นหาข้อมูล..." onkeyup="filterTable()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterStatus" onchange="filterTable()">
                            <option value="">-- กรองตามสถานะทั้งหมด --</option>
                            <option value="ปกติ">ปกติ</option>
                            <option value="พบประเด็น">พบประเด็น</option>
                            <option value="อันตรายเร่งด่วน">อันตรายเร่งด่วน</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterDept" onchange="filterTable()">
                            <option value="">-- กรองตามแผนกทั้งหมด --</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- ตารางแสดงรายการ -->
        <div class="card">
            <div class="card-header bg-dark text-white fw-semibold">
                <i class="fa-solid fa-table-list"></i> รายการบันทึก Safety Patrol ทั้งหมด
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="patrolTable">
                        <thead class="table-light">
                            <tr>
                                <th>วันที่/เวลา</th>
                                <th>ผู้ตรวจ</th>
                                <th>แผนกที่พบ</th>
                                <th>ประเด็น</th>
                                <th>สถานะ</th>
                                <th>รูปภาพ</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="7" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal แสดงรูปภาพขนาดใหญ่ -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">รูปภาพหลักฐาน</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImg" src="" class="img-fluid rounded" alt="Evidence">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // URL ของ Google Apps Script ที่เชื่อมต่อกับบัญชี Kannika.patpat@gmail.com
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzQXOoKIGTiR2n8yqKRoa_vcWLMc8nQSDK0Ma6bWzgmWbrG-EUwfiT8YkdZZUxLMQqJ/exec';
        let allData = [];

        document.addEventListener("DOMContentLoaded", function() {
            setDefaultDateTime();
            loadData();

            document.getElementById("patrolForm").addEventListener("submit", function(e) {
                e.preventDefault();
                submitData();
            });
        });

        function setDefaultDateTime() {
            const now = new Date();
            document.getElementById("date").value = now.toISOString().split('T')[0];
            document.getElementById("time").value = now.toTimeString().split(' ')[0].substring(0,5);
        }

        function resetForm() {
            document.getElementById("patrolForm").reset();
            setDefaultDateTime();
        }

        function showLoading() { document.getElementById("loading").classList.remove("d-none"); }
        function hideLoading() { document.getElementById("loading").classList.add("d-none"); }

        function loadData() {
            showLoading();
            fetch(scriptURL + "?action=getData")
                .then(res => res.json())
                .then(res => {
                    hideLoading();
                    if(res.status === "success") {
                        allData = res.data;
                        updateDashboard(allData);
                        renderTable(allData);
                        updateDepartmentFilter(allData);
                    }
                })
                .catch(err => {
                    hideLoading();
                    console.error(err);
                });
        }

        function submitData() {
            showLoading();
            const imageFile = document.getElementById("imageFile").files[0];

            if (imageFile) {
                const reader = new FileReader();
                reader.readAsDataURL(imageFile);
                reader.onload = function () {
                    sendDataToServer({
                        action: "add",
                        inspector: document.getElementById("inspector").value,
                        position: document.getElementById("position").value,
                        date: document.getElementById("date").value,
                        time: document.getElementById("time").value,
                        status: document.getElementById("status").value,
                        issue: document.getElementById("issue").value,
                        department: document.getElementById("department").value,
                        details: document.getElementById("details").value,
                        image: reader.result,
                        imageName: imageFile.name
                    });
                };
            } else {
                sendDataToServer({
                    action: "add",
                    inspector: document.getElementById("inspector").value,
                    position: document.getElementById("position").value,
                    date: document.getElementById("date").value,
                    time: document.getElementById("time").value,
                    status: document.getElementById("status").value,
                    issue: document.getElementById("issue").value,
                    department: document.getElementById("department").value,
                    details: document.getElementById("details").value,
                    image: "",
                    imageName: ""
                });
            }
        }

        function sendDataToServer(payload) {
            fetch(scriptURL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                hideLoading();
                if(res.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ!',
                        text: 'บันทึกข้อมูลเรียบร้อยแล้ว',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    resetForm();
                    loadData();
                } else {
                    Swal.fire("Error", res.message, "error");
                }
            })
            .catch(err => {
                hideLoading();
                Swal.fire("Error", "ไม่สามารถส่งข้อมูลได้", "error");
            });
        }

        function deleteData(id) {
            Swal.fire({
                title: 'คุณแน่ใจหรือไม่?',
                text: "ต้องการลบรายการนี้ใช่ไหม!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'ใช่, ลบเลย',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoading();
                    fetch(scriptURL, {
                        method: "POST",
                        body: JSON.stringify({ action: "delete", id: id })
                    })
                    .then(res => res.json())
                    .then(res => {
                        hideLoading();
                        if(res.status === "success") {
                            Swal.fire('ลบสำเร็จ!', 'ข้อมูลถูกลบเรียบร้อยแล้ว', 'success');
                            loadData();
                        } else {
                            Swal.fire('Error', res.message, 'error');
                        }
                    });
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if(!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">ไม่พบข้อมูล</td></tr>`;
                return;
            }

            data.slice().reverse().forEach(row => {
                let badgeClass = "bg-secondary";
                if(row.สถานะ === "ปกติ") badgeClass = "bg-success";
                else if(row.สถานะ === "พบประเด็น") badgeClass = "bg-warning text-dark";
                else if(row.สถานะ === "อันตรายเร่งด่วน") badgeClass = "bg-danger";

                let imageHtml = row.รูปภาพ ? `<button class="btn btn-sm btn-outline-info" onclick="showImage('${row.รูปภาพ}')"><i class="fa-solid fa-image"></i> ดูรูป</button>` : '<span class="text-muted">-</span>';

                tbody.innerHTML += `<tr>
                    <td>${row.วันที่ || ''} <br><small class="text-muted">${row.เวลา || ''}</small></td>
                    <td>${row.ผู้ตรวจ || ''}<br><small class="text-muted">${row.ตำแหน่ง || ''}</small></td>
                    <td>${row['แผนก/ฝ่าย'] || ''}</td>
                    <td><strong>${row['ประเด็นที่พบ'] || ''}</strong><br><small class="text-muted">${row.รายละเอียด || ''}</small></td>
                    <td><span class="badge ${badgeClass}">${row.สถานะ || ''}</span></td>
                    <td>${imageHtml}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteData('${row.ID}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        }

        function updateDashboard(data) {
            if(!data) return;
            document.getElementById("count-total").innerText = data.length;
            document.getElementById("count-normal").innerText = data.filter(d => d.สถานะ === "ปกติ").length;
            document.getElementById("count-pending").innerText = data.filter(d => d.สถานะ === "พบประเด็น").length;
            document.getElementById("count-danger").innerText = data.filter(d => d.สถานะ === "อันตรายเร่งด่วน").length;
        }

        function updateDepartmentFilter(data) {
            if(!data) return;
            const deptSet = [...new Set(data.map(d => d['แผนก/ฝ่าย']))];
            const filterDept = document.getElementById("filterDept");
            filterDept.innerHTML = '<option value="">-- กรองตามแผนกทั้งหมด --</option>';
            deptSet.forEach(dept => {
                if(dept) {
                    filterDept.innerHTML += `<option value="${dept}">${dept}</option>`;
                }
            });
        }

        function filterTable() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            const statusFilter = document.getElementById("filterStatus").value;
            const deptFilter = document.getElementById("filterDept").value;

            let filtered = allData.filter(row => {
                let matchKeyword = (row.ผู้ตรวจ && row.ผู้ตรวจ.toLowerCase().includes(keyword)) ||
                                   (row['แผนก/ฝ่าย'] && row['แผนก/ฝ่าย'].toLowerCase().includes(keyword)) ||
                                   (row['ประเด็นที่พบ'] && row['ประเด็นที่พบ'].toLowerCase().includes(keyword));
                
                let matchStatus = statusFilter === "" || row.สถานะ === statusFilter;
                let matchDept = deptFilter === "" || row['แผนก/ฝ่าย'] === deptFilter;

                return matchKeyword && matchStatus && matchDept;
            });

            renderTable(filtered);
        }

        function showImage(url) {
            document.getElementById("modalImg").src = url;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        }
    </script>
</body>
</html>
